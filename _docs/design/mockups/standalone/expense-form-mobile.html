<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  @import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap");
  * { box-sizing: border-box; }
  body { margin: 0; }
  a { color: #4f46e5; text-decoration: none; }
  a:hover { color: #4338ca; }
</style>
</head>
<body>
<div style="height:844px; width:100%; background:#ffffff; font-family:'IBM Plex Sans', system-ui, sans-serif; color:#0f172a; display:flex; flex-direction:column;">

  <div style="display:flex; align-items:center; justify-content:space-between; padding:18px 16px; border-bottom:1px solid #e2e8f0; flex-shrink:0;">
    <button style="background:none; border:none; padding:6px 4px; font-size:15px; font-family:inherit; color:#64748b; cursor:pointer;">Cancel</button>
    <span style="font-size:16px; font-weight:600;">Add expense</span>
    <button style="background:none; border:none; padding:6px 4px; font-size:15px; font-weight:600; font-family:inherit; color:#4f46e5; cursor:pointer;">Save</button>
  </div>

  <div style="flex:1; overflow:hidden; padding:20px 20px; display:flex; flex-direction:column; gap:18px;">

    <div style="display:flex; flex-direction:column; gap:6px;">
      <label style="font-size:13px; font-weight:500; color:#475569;">Description</label>
      <input type="text" placeholder="e.g. Groceries" style="padding:12px 14px; border:1px solid #cbd5e1; border-radius:8px; font-size:15px; font-family:inherit; color:#0f172a;" />
    </div>

    <div style="display:flex; flex-direction:column; gap:6px;">
      <label style="font-size:13px; font-weight:500; color:#475569;">Amount</label>
      <div style="display:flex; align-items:center; border:1px solid #cbd5e1; border-radius:8px; overflow:hidden;">
        <span style="padding:12px 0 12px 14px; font-size:15px; color:#64748b;">$</span>
        <input type="text" placeholder="0.00" style="flex:1; padding:12px 14px 12px 4px; border:none; outline:none; font-size:15px; font-family:inherit; color:#0f172a;" />
      </div>
    </div>

    <div style="display:flex; flex-direction:column; gap:6px;">
      <label style="font-size:13px; font-weight:500; color:#475569;">Paid by</label>
      <div style="display:flex; align-items:center; justify-content:space-between; padding:12px 14px; border:1px solid #cbd5e1; border-radius:8px; font-size:15px;">
        <span>Alice Chen</span>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
      </div>
    </div>

    <div style="display:flex; flex-direction:column; gap:6px;">
      <label style="font-size:13px; font-weight:500; color:#475569;">Date</label>
      <div style="display:flex; align-items:center; justify-content:space-between; padding:12px 14px; border:1px solid #cbd5e1; border-radius:8px; font-size:15px;">
        <span>Oct 4, 2025</span>
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#64748b" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
      </div>
    </div>

    <div style="display:flex; flex-direction:column; gap:8px;">
      <label style="font-size:13px; font-weight:500; color:#475569;">Split between</label>
      <div style="display:flex; flex-direction:column; border:1px solid #e2e8f0; border-radius:8px;">
        <div style="display:flex; align-items:center; gap:12px; padding:12px 12px; border-bottom:1px solid #f1f5f9;">
          <div style="width:20px; height:20px; border-radius:6px; background:#4f46e5; display:flex; align-items:center; justify-content:center; flex-shrink:0;">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13l4 4L19 7"/></svg>
          </div>
          <span style="font-size:15px;">Alice Chen</span>
        </div>
        <div style="display:flex; align-items:center; gap:12px; padding:12px 12px; border-bottom:1px solid #f1f5f9;">
          <div style="width:20px; height:20px; border-radius:6px; background:#4f46e5; display:flex; align-items:center; justify-content:center; flex-shrink:0;">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13l4 4L19 7"/></svg>
          </div>
          <span style="font-size:15px;">Bob Diaz</span>
        </div>
        <div style="display:flex; align-items:center; gap:12px; padding:12px 12px; border-bottom:1px solid #f1f5f9;">
          <div style="width:20px; height:20px; border-radius:6px; background:#4f46e5; display:flex; align-items:center; justify-content:center; flex-shrink:0;">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13l4 4L19 7"/></svg>
          </div>
          <span style="font-size:15px;">Priya Nair</span>
        </div>
        <div style="display:flex; align-items:center; gap:12px; padding:12px 12px;">
          <div style="width:20px; height:20px; border-radius:6px; background:#4f46e5; display:flex; align-items:center; justify-content:center; flex-shrink:0;">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13l4 4L19 7"/></svg>
          </div>
          <span style="font-size:15px;">Sam Okafor</span>
        </div>
      </div>
      <span style="font-size:12px; color:#64748b;">Splits equally between everyone selected.</span>
    </div>

  </div>
</div>
</body>
</html>
