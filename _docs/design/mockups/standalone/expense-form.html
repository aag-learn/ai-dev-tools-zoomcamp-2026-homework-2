<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  @import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap");
  * { box-sizing: border-box; }
  body { margin: 0; }
  a { color: #4f46e5; text-decoration: none; }
  a:hover { color: #4338ca; }
</style>
</head>
<body>
<div style="position:relative; min-height:900px; width:100%; background:#f8fafc; font-family:'IBM Plex Sans', system-ui, sans-serif; color:#0f172a;">

  <div style="display:flex; min-height:900px; width:100%; filter:blur(1px); opacity:0.55;">
    <div style="width:220px; flex-shrink:0; background:#ffffff; border-right:1px solid #e2e8f0;"></div>
    <div style="flex:1; padding:48px 56px;">
      <div style="height:32px; width:160px; background:#e2e8f0; border-radius:6px; margin-bottom:24px;"></div>
      <div style="height:220px; width:100%; max-width:820px; background:#ffffff; border:1px solid #e2e8f0; border-radius:12px;"></div>
    </div>
  </div>

  <div style="position:absolute; inset:0; background:rgba(15,23,42,0.45); display:flex; align-items:center; justify-content:center;">
    <div style="width:480px; background:#ffffff; border-radius:16px; box-shadow:0 24px 48px -12px rgba(15,23,42,0.35); padding:28px; display:flex; flex-direction:column; gap:20px;">

      <div style="display:flex; align-items:center; justify-content:space-between;">
        <h2 style="margin:0; font-size:19px; font-weight:600; letter-spacing:-0.01em;">Add expense</h2>
        <div style="width:28px; height:28px; border-radius:7px; display:flex; align-items:center; justify-content:center; color:#64748b;">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </div>
      </div>

      <div style="display:flex; flex-direction:column; gap:6px;">
        <label style="font-size:13px; font-weight:500; color:#475569;">Description</label>
        <input type="text" placeholder="e.g. Groceries" style="padding:10px 12px; border:1px solid #cbd5e1; border-radius:8px; font-size:14px; font-family:inherit; color:#0f172a;" />
      </div>

      <div style="display:flex; flex-direction:column; gap:6px;">
        <label style="font-size:13px; font-weight:500; color:#475569;">Amount</label>
        <div style="display:flex; align-items:center; border:1px solid #cbd5e1; border-radius:8px; overflow:hidden;">
          <span style="padding:10px 0 10px 12px; font-size:14px; color:#64748b;">$</span>
          <input type="text" placeholder="0.00" style="flex:1; padding:10px 12px 10px 4px; border:none; outline:none; font-size:14px; font-family:inherit; color:#0f172a;" />
        </div>
      </div>

      <div style="display:flex; gap:12px;">
        <div style="display:flex; flex-direction:column; gap:6px; flex:1;">
          <label style="font-size:13px; font-weight:500; color:#475569;">Paid by</label>
          <div style="display:flex; align-items:center; justify-content:space-between; padding:10px 12px; border:1px solid #cbd5e1; border-radius:8px; font-size:14px;">
            <span>Alice Chen</span>
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
          </div>
        </div>
        <div style="display:flex; flex-direction:column; gap:6px; flex:1;">
          <label style="font-size:13px; font-weight:500; color:#475569;">Date</label>
          <div style="display:flex; align-items:center; justify-content:space-between; padding:10px 12px; border:1px solid #cbd5e1; border-radius:8px; font-size:14px;">
            <span>Oct 4, 2025</span>
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#64748b" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
          </div>
        </div>
      </div>

      <div style="display:flex; flex-direction:column; gap:8px;">
        <label style="font-size:13px; font-weight:500; color:#475569;">Split between</label>
        <div style="display:flex; flex-direction:column; gap:2px; border:1px solid #e2e8f0; border-radius:8px; padding:4px;">
          <div style="display:flex; align-items:center; gap:10px; padding:8px 8px; border-radius:6px;">
            <div style="width:18px; height:18px; border-radius:5px; background:#4f46e5; display:flex; align-items:center; justify-content:center; flex-shrink:0;">
              <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13l4 4L19 7"/></svg>
            </div>
            <span style="font-size:14px;">Alice Chen</span>
          </div>
          <div style="display:flex; align-items:center; gap:10px; padding:8px 8px; border-radius:6px;">
            <div style="width:18px; height:18px; border-radius:5px; background:#4f46e5; display:flex; align-items:center; justify-content:center; flex-shrink:0;">
              <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13l4 4L19 7"/></svg>
            </div>
            <span style="font-size:14px;">Bob Diaz</span>
          </div>
          <div style="display:flex; align-items:center; gap:10px; padding:8px 8px; border-radius:6px;">
            <div style="width:18px; height:18px; border-radius:5px; background:#4f46e5; display:flex; align-items:center; justify-content:center; flex-shrink:0;">
              <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13l4 4L19 7"/></svg>
            </div>
            <span style="font-size:14px;">Priya Nair</span>
          </div>
          <div style="display:flex; align-items:center; gap:10px; padding:8px 8px; border-radius:6px;">
            <div style="width:18px; height:18px; border-radius:5px; background:#4f46e5; display:flex; align-items:center; justify-content:center; flex-shrink:0;">
              <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13l4 4L19 7"/></svg>
            </div>
            <span style="font-size:14px;">Sam Okafor</span>
          </div>
        </div>
        <span style="font-size:12px; color:#64748b;">Splits equally between everyone selected.</span>
      </div>

      <div style="display:flex; justify-content:flex-end; gap:10px; margin-top:4px;">
        <button style="padding:0 16px; height:38px; background:#ffffff; color:#475569; border:1px solid #cbd5e1; border-radius:8px; font-size:14px; font-weight:600; font-family:inherit; cursor:pointer;">Cancel</button>
        <button style="padding:0 16px; height:38px; background:#4f46e5; color:#ffffff; border:none; border-radius:8px; font-size:14px; font-weight:600; font-family:inherit; cursor:pointer;">Save expense</button>
      </div>

    </div>
  </div>
</div>
</body>
</html>
