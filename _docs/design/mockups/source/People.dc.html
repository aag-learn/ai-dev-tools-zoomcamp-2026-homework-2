<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap');
    * { box-sizing: border-box; }
    body { margin: 0; }
    a { color: #4f46e5; text-decoration: none; }
    a:hover { color: #4338ca; }
  </style>
</helmet>
<div style="display:flex; min-height:900px; width:100%; background:#f8fafc; font-family:'IBM Plex Sans', system-ui, sans-serif; color:#0f172a;">

  <div style="width:220px; flex-shrink:0; background:#ffffff; border-right:1px solid #e2e8f0; display:flex; flex-direction:column; padding:28px 16px; gap:28px;">
    <div style="display:flex; align-items:center; gap:10px; padding:0 8px;">
      <div style="width:28px; height:28px; border-radius:8px; background:#4f46e5; display:flex; align-items:center; justify-content:center; flex-shrink:0;">
        <svg width="15" height="15" viewBox="0 0 16 16" fill="none">
          <rect x="1" y="2" width="2" height="12" rx="1" fill="#ffffff"/>
          <rect x="5" y="2" width="2" height="12" rx="1" fill="#ffffff"/>
          <rect x="9" y="2" width="2" height="12" rx="1" fill="#ffffff"/>
          <rect x="0.5" y="6.5" width="13" height="2" rx="1" fill="#ffffff" transform="rotate(-24 7 7.5)"/>
        </svg>
      </div>
      <span style="font-weight:600; font-size:17px; color:#0f172a; letter-spacing:-0.01em;">Tally</span>
    </div>
    <nav style="display:flex; flex-direction:column; gap:2px;">
      <div style="display:flex; align-items:center; gap:10px; padding:9px 12px; border-radius:8px; background:#eef2ff;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#4338ca" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="8" r="3.5"/>
          <path d="M4.5 20c1.2-4 4-6 7.5-6s6.3 2 7.5 6"/>
        </svg>
        <span style="font-size:14px; font-weight:600; color:#4338ca;">People</span>
      </div>
      <div style="display:flex; align-items:center; gap:10px; padding:9px 12px; border-radius:8px;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#64748b" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
          <path d="M6 3h12v17l-2.5-1.5L13 20l-2.5-1.5L8 20l-2-1.5V3Z"/>
          <path d="M9 8h6M9 12h6M9 16h3"/>
        </svg>
        <span style="font-size:14px; font-weight:500; color:#475569;">Expenses</span>
      </div>
      <div style="display:flex; align-items:center; gap:10px; padding:9px 12px; border-radius:8px;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#64748b" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 3v3M12 17v4M7 20h10"/>
          <path d="M4 8h6M14 8h6"/>
          <path d="M4 8l-2.4 5a2.8 2.8 0 0 0 5.6 0Z"/>
          <path d="M20 8l-2.4 5a2.8 2.8 0 0 0 5.6 0Z"/>
        </svg>
        <span style="font-size:14px; font-weight:500; color:#475569;">Balances</span>
      </div>
    </nav>
  </div>

  <div style="flex:1; padding:48px 56px; display:flex; flex-direction:column; gap:28px; max-width:720px;">
    <div>
      <h1 style="font-size:26px; font-weight:600; margin:0 0 4px 0; letter-spacing:-0.01em;">People</h1>
      <p style="margin:0; color:#64748b; font-size:14px;">Everyone splitting expenses in this group.</p>
    </div>

    <div style="display:flex; gap:8px;">
      <input type="text" placeholder="Add a person's name" style="flex:1; padding:10px 14px; border:1px solid #cbd5e1; border-radius:8px; font-size:14px; font-family:inherit; color:#0f172a; background:#ffffff;" />
      <button style="display:flex; align-items:center; gap:6px; padding:0 16px; background:#4f46e5; color:#ffffff; border:none; border-radius:8px; font-size:14px; font-weight:600; font-family:inherit; cursor:pointer;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
        Add
      </button>
    </div>

    <div style="display:flex; flex-direction:column; border:1px solid #e2e8f0; border-radius:12px; overflow:hidden; background:#ffffff;">
      <div style="display:flex; align-items:center; gap:12px; padding:16px 20px; border-bottom:1px solid #f1f5f9;">
        <div style="width:36px; height:36px; border-radius:999px; background:#eef2ff; color:#4338ca; display:flex; align-items:center; justify-content:center; font-weight:600; font-size:14px;">A</div>
        <span style="font-size:15px; font-weight:500;">Alice Chen</span>
      </div>
      <div style="display:flex; align-items:center; gap:12px; padding:16px 20px; border-bottom:1px solid #f1f5f9;">
        <div style="width:36px; height:36px; border-radius:999px; background:#eef2ff; color:#4338ca; display:flex; align-items:center; justify-content:center; font-weight:600; font-size:14px;">B</div>
        <span style="font-size:15px; font-weight:500;">Bob Diaz</span>
      </div>
      <div style="display:flex; align-items:center; gap:12px; padding:16px 20px; border-bottom:1px solid #f1f5f9;">
        <div style="width:36px; height:36px; border-radius:999px; background:#eef2ff; color:#4338ca; display:flex; align-items:center; justify-content:center; font-weight:600; font-size:14px;">P</div>
        <span style="font-size:15px; font-weight:500;">Priya Nair</span>
      </div>
      <div style="display:flex; align-items:center; gap:12px; padding:16px 20px;">
        <div style="width:36px; height:36px; border-radius:999px; background:#eef2ff; color:#4338ca; display:flex; align-items:center; justify-content:center; font-weight:600; font-size:14px;">S</div>
        <span style="font-size:15px; font-weight:500;">Sam Okafor</span>
      </div>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
