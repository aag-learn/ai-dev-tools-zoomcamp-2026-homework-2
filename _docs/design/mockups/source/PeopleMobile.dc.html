<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap');
    * { box-sizing: border-box; }
    body { margin: 0; }
    a { color: #4f46e5; text-decoration: none; }
    a:hover { color: #4338ca; }
  </style>
</helmet>
<div style="position:relative; height:844px; width:100%; background:#f8fafc; font-family:'IBM Plex Sans', system-ui, sans-serif; color:#0f172a; overflow:hidden;">

  <div style="display:flex; flex-direction:column; height:100%; padding-bottom:76px;">
    <div style="display:flex; align-items:center; justify-content:space-between; padding:20px 20px 14px 20px;">
      <h1 style="margin:0; font-size:22px; font-weight:600; letter-spacing:-0.01em;">People</h1>
      <button style="width:40px; height:40px; flex-shrink:0; background:#4f46e5; border:none; border-radius:10px; display:flex; align-items:center; justify-content:center; cursor:pointer;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      </button>
    </div>

    <div style="padding:0 20px 16px 20px;">
      <input type="text" placeholder="Add a person's name" style="width:100%; padding:12px 14px; border:1px solid #cbd5e1; border-radius:8px; font-size:14px; font-family:inherit; color:#0f172a; background:#ffffff;" />
    </div>

    <div style="flex:1; overflow:hidden; padding:0 20px;">
      <div style="display:flex; flex-direction:column; border:1px solid #e2e8f0; border-radius:12px; overflow:hidden; background:#ffffff;">
        <div style="display:flex; align-items:center; gap:12px; padding:14px 16px; border-bottom:1px solid #f1f5f9;">
          <div style="width:36px; height:36px; border-radius:999px; background:#eef2ff; color:#4338ca; display:flex; align-items:center; justify-content:center; font-weight:600; font-size:14px; flex-shrink:0;">A</div>
          <span style="font-size:15px; font-weight:500;">Alice Chen</span>
        </div>
        <div style="display:flex; align-items:center; gap:12px; padding:14px 16px; border-bottom:1px solid #f1f5f9;">
          <div style="width:36px; height:36px; border-radius:999px; background:#eef2ff; color:#4338ca; display:flex; align-items:center; justify-content:center; font-weight:600; font-size:14px; flex-shrink:0;">B</div>
          <span style="font-size:15px; font-weight:500;">Bob Diaz</span>
        </div>
        <div style="display:flex; align-items:center; gap:12px; padding:14px 16px; border-bottom:1px solid #f1f5f9;">
          <div style="width:36px; height:36px; border-radius:999px; background:#eef2ff; color:#4338ca; display:flex; align-items:center; justify-content:center; font-weight:600; font-size:14px; flex-shrink:0;">P</div>
          <span style="font-size:15px; font-weight:500;">Priya Nair</span>
        </div>
        <div style="display:flex; align-items:center; gap:12px; padding:14px 16px;">
          <div style="width:36px; height:36px; border-radius:999px; background:#eef2ff; color:#4338ca; display:flex; align-items:center; justify-content:center; font-weight:600; font-size:14px; flex-shrink:0;">S</div>
          <span style="font-size:15px; font-weight:500;">Sam Okafor</span>
        </div>
      </div>
    </div>
  </div>

  <div style="position:absolute; left:0; right:0; bottom:0; height:70px; background:#ffffff; border-top:1px solid #e2e8f0; display:flex; align-items:flex-start; justify-content:space-around; padding-top:8px;">
    <div style="display:flex; flex-direction:column; align-items:center; gap:3px; min-width:64px;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#4338ca" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="8" r="3.5"/>
        <path d="M4.5 20c1.2-4 4-6 7.5-6s6.3 2 7.5 6"/>
      </svg>
      <span style="font-size:11px; font-weight:600; color:#4338ca;">People</span>
    </div>
    <div style="display:flex; flex-direction:column; align-items:center; gap:3px; min-width:64px;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#64748b" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
        <path d="M6 3h12v17l-2.5-1.5L13 20l-2.5-1.5L8 20l-2-1.5V3Z"/>
        <path d="M9 8h6M9 12h6M9 16h3"/>
      </svg>
      <span style="font-size:11px; font-weight:500; color:#64748b;">Expenses</span>
    </div>
    <div style="display:flex; flex-direction:column; align-items:center; gap:3px; min-width:64px;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#64748b" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 3v3M12 17v4M7 20h10"/>
        <path d="M4 8h6M14 8h6"/>
        <path d="M4 8l-2.4 5a2.8 2.8 0 0 0 5.6 0Z"/>
        <path d="M20 8l-2.4 5a2.8 2.8 0 0 0 5.6 0Z"/>
      </svg>
      <span style="font-size:11px; font-weight:500; color:#64748b;">Balances</span>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
